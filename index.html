---
layout: default
---
<header class="mast">
  <h1>Ada's Workbench</h1>
  <p class="tagline">工具、筆記，還有一些順手寫下的東西。</p>
  <hr class="dots">
</header>

<section class="notes" id="notes">
  <h2>筆記</h2>
  {% if site.posts.size > 0 %}
  <ul class="note-grid" data-paginate="10">
    {% for post in site.posts %}{% include post-card.html post=post show_cat=true %}{% endfor %}
  </ul>
  {% else %}
  <p class="note-empty">這頁還空著，之後寫點東西放這裡。</p>
  {% endif %}
</section>

<img class="doodle" src="/assets/heart.png" alt="" aria-hidden="true">
