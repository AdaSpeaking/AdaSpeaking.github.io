media:
  input: assets/uploads
  output: /assets/uploads
  categories: [image]

content:
  - name: posts
    label: 文章
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    view:
      primary: title
      fields: [title, cat, date]
      sort: date
      order: desc
    fields:
      - name: title
        label: 標題
        type: string
        required: true
      - name: date
        label: 日期
        type: date
      - name: cat
        label: 分類
        type: select
        required: true
        options:
          values:
            - { name: marketing, label: 行銷工具 }
            - { name: analytics, label: 數據分析工具 }
            - { name: toys, label: 自製小玩具 }
            - { name: 360d, label: 才庫相關 }
            - { name: survey, label: 各種問卷調查 }
      - name: tool_url
        label: 工具網址（有填才會出現在工具清單；自己的頁面寫 /repo名稱/）
        type: string
      - name: tool_name
        label: 工具小卡名稱（空白就用文章標題）
        type: string
      - name: body
        label: 內文
        type: rich-text

  - name: nav
    label: 左側選單分類
    type: file
    path: _data/nav.yml
    format: yaml
    fields:
      - name: categories
        label: 分類（順序＝選單順序）
        type: object
        list: true
        fields:
          - name: key
            label: 代號（勿改，文章靠它歸類）
            type: string
            required: true
          - name: name
            label: 顯示名稱
            type: string
            required: true
          - name: icon
            label: 圖示
            type: select
            options:
              values:
                - { name: megaphone, label: 大聲公 }
                - { name: gear, label: 齒輪 }
                - { name: chart, label: 長條圖 }
                - { name: dice, label: 骰子 }
                - { name: building, label: 大樓 }
                - { name: clipboard, label: 問卷夾板 }
                - { name: pen, label: 筆 }
                - { name: star, label: 星星 }
                - { name: folder, label: 資料夾 }
