<aside class="side" id="side" aria-label="選單">
  <div class="side-top">
    <button class="icon-btn" id="toggle" aria-label="展開或收合選單" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
    <a class="brand" href="/" style="text-decoration:none">Ada's Workbench</a>
  </div>

  <nav class="cats">
    <a class="cat-head{% if page.list_type == 'tools' %} active{% endif %}" href="/tools/" title="所有工具清單" data-nav="tools">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
      <span class="cat-name">所有工具清單</span>
    </a>
    <div class="nav-sep"></div>
    {% for cat in site.data.nav.categories %}
    <a class="cat-head{% if page.cat == cat.key %} active{% endif %}" href="/articles/?c={{ cat.key }}" title="{{ cat.name }}" data-nav="articles-{{ cat.key }}">
      {% include icon.html name=cat.icon %}
      <span class="cat-name">{{ cat.name }}</span>
    </a>
    {% endfor %}
  </nav>

  <div class="side-foot">adaspeaking.cloud</div>
</aside>
<div class="scrim" id="scrim"></div>
