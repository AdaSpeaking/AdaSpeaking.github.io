<aside class="side" id="side" aria-label="選單">
  <div class="side-top">
    <button class="icon-btn" id="toggle" aria-label="展開或收合選單" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
    <a class="brand" href="/" style="text-decoration:none">Ada's Workbench</a>
  </div>

  <nav class="cats">
    {% for cat in site.data.nav.categories %}
    <div class="cat{% if cat.open %} expanded{% endif %}" data-cat="{{ cat.key }}">
      <button class="cat-head" aria-expanded="{% if cat.open %}true{% else %}false{% endif %}" title="{{ cat.name }}">
        {% include icon.html name=cat.icon %}
        <span class="cat-name">{{ cat.name }}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="cat-items">
        <a class="item" href="/articles/?c={{ cat.key }}" data-nav="articles-{{ cat.key }}">文章清單</a>
        <a class="item" href="/tools/?c={{ cat.key }}" data-nav="tools-{{ cat.key }}">工具清單</a>
      </div>
    </div>
    {% endfor %}
  </nav>

  <div class="side-foot">adaspeaking.cloud</div>
</aside>
<div class="scrim" id="scrim"></div>
