<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPSS 進階報表產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2a3a; --ink-2:#4a5a6c; --ink-3:#7c8a99;
  --paper:#f5f7f9; --surface:#ffffff; --line:#dde3e9; --line-2:#c9d2db;
  --accent:#1b6b73; --accent-2:#e3f0f1;
  --b1:#1b6b73; --b2:#7fb8bc; --b3:#e6c27f; --b4:#d9776b;
  --danger:#b3413a;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e6ecf1; --ink-2:#b3bfca; --ink-3:#8594a3;
    --paper:#141b22; --surface:#1c252e; --line:#2c3843; --line-2:#3a4855;
    --accent:#5fb3ba; --accent-2:#1f3438; --danger:#e0776f;
  }
}
:root[data-theme="dark"]{
  --ink:#e6ecf1; --ink-2:#b3bfca; --ink-3:#8594a3;
  --paper:#141b22; --surface:#1c252e; --line:#2c3843; --line-2:#3a4855;
  --accent:#5fb3ba; --accent-2:#1f3438; --danger:#e0776f;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 64px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-size:26px;font-weight:700;letter-spacing:.02em;margin:0;line-height:1.3}
.privacy{color:var(--ink-3);font-size:13px;margin:0}
.scale{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0 28px;border-radius:3px;overflow:hidden}
.scale span{font-size:12px;padding:3px 8px;color:#fff;font-weight:500}
.scale span:nth-child(1){background:var(--b1)}
.scale span:nth-child(2){background:var(--b2);color:#10333a}
.scale span:nth-child(3){background:var(--b3);color:#4a3510}
.scale span:nth-child(4){background:var(--b4)}

.uploads{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drop{position:relative;border:1.5px dashed var(--line-2);border-radius:8px;padding:18px 20px;background:var(--surface);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-2)}
.drop.ok{border-style:solid;border-color:var(--accent)}
.drop h2{font-size:16px;margin:0 0 2px;font-weight:700}
.drop p{margin:0;color:var(--ink-2);font-size:13px}
.drop .status{margin-top:10px;font-size:13px;color:var(--accent);font-weight:500;min-height:1.6em}
.drop .status.err{color:var(--danger)}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.opt{font-weight:400;color:var(--ink-3);font-size:13px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin:22px 0 0;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:14px}
.bar .n{font-weight:700;font-size:15px}
.bar label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.bar input[type=number]{width:64px;padding:3px 6px;border:1px solid var(--line-2);border-radius:4px;background:var(--paper)}
.bar .grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.bar .lbl{color:var(--ink-3)}

nav.tabs{display:flex;align-items:flex-end;gap:4px;margin:28px 0 0;border-bottom:1px solid var(--line-2)}
nav.tabs button{background:none;border:0;padding:10px 18px;font-size:16px;font-weight:500;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
nav.tabs .spacer{flex:1}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
nav.tabs .btn{margin-bottom:8px}

section.panel{padding-top:24px}
section.panel[hidden]{display:none}
h3.sec{font-size:18px;margin:32px 0 12px;font-weight:700}
h3.sec:first-child{margin-top:0}
.sub{color:var(--ink-2);font-size:13px;margin:-8px 0 14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(520px,1fr))}
.fig{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 12px 8px;color:#1c2a3a}
.fig .cv{position:relative;width:100%}
.fig .foot{display:flex;justify-content:flex-end;padding-top:6px}
.fig .foot .btn{background:#fff;color:#1c2a3a;border-color:#d5dce3;font-size:12px;padding:4px 10px}
.fig .foot .btn:hover{color:#1b6b73;border-color:#1b6b73}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--ink-2);background:var(--paper);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{text-align:right;white-space:nowrap}
td.desc{min-width:320px;color:var(--ink-2);font-size:13px}
.dim-block{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;align-items:start;margin-bottom:22px}

.bench{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
.editor{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;max-height:calc(100vh - 40px);overflow:auto}
.editor label.f{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.editor select{width:100%;padding:7px 8px;border:1px solid var(--line-2);border-radius:5px;background:var(--paper)}
.editor .hint{font-size:12px;color:var(--ink-3);margin:10px 0 8px;line-height:1.5}
.gl{list-style:none;margin:0;padding:0}
.gl li{display:grid;grid-template-columns:20px 1fr 36px 44px;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.gl li.off{opacity:.45}
.gl .raw{font-size:11px;color:var(--ink-3);grid-column:2/5;margin-top:-4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl input[type=text]{width:100%;padding:3px 6px;border:1px solid var(--line-2);border-radius:4px;background:var(--paper);font-size:14px}
.gl .cnt{font-size:12px;color:var(--ink-3);text-align:right}
.gl .mv{display:flex;gap:2px}
.gl .mv button{border:1px solid var(--line-2);background:var(--paper);border-radius:3px;width:20px;height:22px;padding:0;font-size:11px;line-height:1}
.editor .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:10px}

.group-head{display:flex;align-items:baseline;gap:10px;margin:34px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.group-head h4{margin:0;font-size:18px}
.group-head span{color:var(--ink-3);font-size:13px}
.sw{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin:0 0 10px;color:var(--ink-2)}
.sw b{color:var(--ink);font-weight:500}

.empty{padding:60px 20px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:8px;margin-top:28px}
.addpie{display:flex;gap:8px;align-items:center;margin:0 0 14px;flex-wrap:wrap;font-size:14px}
.addpie select{padding:5px 8px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.warn{font-size:13px;color:var(--danger);margin:8px 0 0}

@media (max-width:860px){
  .uploads{grid-template-columns:1fr}
  .bench{grid-template-columns:1fr}
  .editor{position:static;max-height:none}
  .dim-block{grid-template-columns:1fr}
  .grid,.grid.wide{grid-template-columns:1fr}
  nav.tabs{flex-wrap:wrap}
  nav.tabs button{padding:8px 12px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.hl td.tag{white-space:nowrap;font-weight:500}
.hl td.tag.hi{color:#1b6b73}
.hl td.tag.lo{color:#b3413a}
.two{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.note{font-size:12px;color:var(--ink-3);margin:8px 0 0}
.bench>*,.grid>*{min-width:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>PPSS 進階報表產生器</h1>
    <p class="privacy">資料只在你的瀏覽器內處理，不會上傳到任何地方。</p>
  </header>
  <div class="scale" aria-label="分數區間色彩"><span>85 分以上</span><span>51–84 分</span><span>16–50 分</span><span>15 分以下</span></div>

  <div class="uploads">
    <div class="drop" id="dropScore">
      <h2>分數資料</h2>
      <p>心測後台＞報表管理＞右上角下載的 Excel，需含「人員編號」與 14 項性格向度分數。</p>
      <div class="status" id="stScore"></div>
      <input type="file" accept=".xlsx,.xls,.csv" id="fScore" aria-label="上傳分數資料">
    </div>
    <div class="drop" id="dropPerson">
      <h2>人員資料 <span class="opt">選填</span></h2>
      <p>心測後台＞人員管理＞右上角下載的 Excel。校標分組欄位（含 [自訂] 標籤）都從這裡來，以「人員編號」對應。</p>
      <div class="status" id="stPerson"></div>
      <input type="file" accept=".xlsx,.xls,.csv" id="fPerson" aria-label="上傳人員資料">
    </div>
  </div>

  <div id="app" hidden>
    <div class="bar">
      <span class="n" id="nLabel"></span>
      <span class="lbl" id="joinLabel"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="bg" aria-selected="true">背景資訊</button>
      <button role="tab" data-tab="overall" aria-selected="false">整體</button>
      <button role="tab" data-tab="bench" aria-selected="false">校標分析</button>
      <span class="spacer"></span>
      <button class="btn primary" id="zipBtn">下載本頁所有圖（ZIP）</button>
    </nav>
    <section class="panel" id="p-bg"></section>
    <section class="panel" id="p-overall" hidden></section>
    <section class="panel" id="p-bench" hidden>
      <div class="bench">
        <aside class="editor" id="editor"></aside>
        <div id="benchOut"></div>
      </div>
    </section>
  </div>
  <div class="empty" id="emptyState">先上傳分數資料，圖表會自動產生。</div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const DESC = {"積極性":{"85分以上":["決斷力強、工作能力強、成就需求高、具企圖心、解決問題的能力強、具應變能力的","若組織遠景及賦予職權不具吸引力時，恐難吸引積極性高的人一同奮鬥"],"51-84分":["具有相當程度的決斷力、成就動機和企圖心；具有蠻不錯的問題解決能力和應變能力","希望組織遠景及所被賦予職權具有一定的吸引力，以驅動個人跟組織一同奮鬥的動力；在缺乏事業發展舞台情況下，職務流動機率相對較大"],"16-50分":["較不在乎組織名氣及個人職銜；具有稍高的工作穩定性；對於現況容易感到滿足","有點優柔寡斷；成就需求和工作壓力忍受度稍低；解決問題的能力和應變能力略微偏弱"],"15分以下":["不在乎組織名氣與個人職銜；工作穩定性較高；較容易滿足於現況","較優柔寡斷、成就需求較淡薄、工作壓力忍受度較低、不擅長解決問題的、應變能力較弱的"]},"責任性":{"85分以上":["做事負責任的、追求完美、工作至上、保守的","不易授權；凡事事必躬親，容易自我加深無形的工作壓力"],"51-84分":["做事具有相當程度的責任心；整體而言是個追求完美的人；多數情況下是有始有終的；對你而言工作是相對重要的；給人略微保守的感覺","不太容易授權給他人；很多時侯會因為事必躬親而無形地加重自己的工作壓力；"],"16-50分":["對工作職責較傾向於公私分明，並認為工作不是人生的全部；在工作之餘，也會注重生活品質；會適度地授權","有時傾向以較少時間完成任務，反而忽略了品質；稍顯馬虎；有時候抱持著享樂主義的想法，給人比較率性的感覺"],"15分以下":["注重生活品質；容易授權；對工作職責抱持公私分明的態度，認為工作不是人生的全部","較追求速率的、較馬馬虎虎的、享樂主義的、較率性的"]},"成熟性":{"85分以上":["自信心強、沉著冷靜、情緒較安定的、矛盾忍受力強、個性開放的、獨立自主、具定見的","因缺乏情緒交流，較易給人有距離的感覺；也因為較難釋放內心壓力，所以主管無法早期得知而給予協助"],"51-84分":["具有相當程度的自信心；多數時候給人沉著冷靜的印象；具一定程度的情緒控制力和矛盾忍受力；相對而言是個性開放的、獨立自主且相當有主見的人","在某些情況下因缺乏情緒交流，較易給人有距離的感覺；有時較難釋放內心壓力，所以主管無法早期得知而給予協助"],"16-50分":["在多數情況下顯得天真不做作的；相對來說比較容易排解心理的壓力；整體而言給人直率而無心機的感覺","有時候情緒控制力和矛盾忍受力會稍弱；比較沒有自信心、較拘謹的、倚賴性較高的、較缺少定見的"],"15分以下":["天真不做作的；容易將內心的壓力釋放出來；是個直率沒有心機的人","自信心較弱、情緒起伏較大、矛盾忍受力較弱、較拘謹、較依賴他人、較無定見"]},"務實性":{"85分以上":["重實際、講求精確、講求規律、重秩序、一絲不茍、井井有條的","容易見樹不見林的；容易出現重複檢查而失去優先順序的情況；容易拘泥枝微末節；較缺乏彈性的"],"51-84分":["多數情況下是重實際的、講求精確和規律的、重秩序的、做事一絲不苟的；具有一定的條理性","相對而言較容易見樹不見林的；在某些事情上較容易為了追求精確、拘泥於細枝末節而忽略了優先順序；有時稍嫌缺乏適度的彈性"],"16-50分":["比較注重大方向；較不拘泥小節的；大致來講，具有嘗試新方向及新方法的勇氣","比較容易見林不見樹；有些大而化之的；比較不喜歡從事需要高度精確的工作；稍微有些急躁的"],"15分以下":["注重大方向、不拘泥小節；具有嘗試新方法的勇氣","較大而化之、不喜歡從事需要高度精確的工作、急躁的"]},"社交性":{"85分以上":["善察言觀色、處事圓融的、善解人意且令人愉快的、人緣好的、隨和的","帶有目的性地溝通；他人較不容易分辨其所表達之意見是否為其內心真實的想法；會因討好對方而隱藏可能產生衝突的爭執點"],"51-84分":["具有相當程度的察言觀色能力；整體而言是個處事圓融、善解人意、隨和且好相處的人","有時會有目的性地溝通；在某些情況下，，他人較不容易分辨其所表達之意見是否為內心真實的想法；有時會因討好對方而隱藏可能產生衝突的爭執點"],"16-50分":["在多數情況下，會表達出個人的真實想法；在工作場合中比較不會受到人情牽絆","有時不太重視人際關係；交際能力稍微偏弱；多數情況下喜歡獨來獨往的；有時會給人不夠善解人意的印象"],"15分以下":["會表達出符合個人的真實想法；不易被人情牽絆","較不善解人意、較喜歡獨來獨往、較不擅交際的、較不重視人際關係"]},"合群性":{"85分以上":["歸屬感的需求高、重情感的、團體取向、重     fr.readAsArrayBuffer(file);
  });
}
function findTable(wb, want){
  let best=null;S._why='';
  for(const name of wb.SheetNames){
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:false});
    for(let i=0;i<Math.min(aoa.length,12);i++){
      const hdr=(aoa[i]||[]).map(norm);
      if(!hdr.includes('人員編號'))continue;
      const nDims=DIMS.filter(x=>hdr.includes(x)).length;
      const isScore=nDims>=10;
      if((want==='score'&&isScore)||(want==='person'&&!isScore)){
        const cand={name,aoa,hi:i,hdr,nDims};
        if(!best||(want==='score'&&nDims>best.nDims))best=cand;
      }
      if(want==='score'&&!isScore)S._why=`「${name}」有人員編號，但只認得 ${nDims} 項性格向度（需至少 10 項）。`;
      if(want==='person'&&isScore)S._why='這看起來是分數檔，請放到左邊。';
      break;
    }
  }
  if(!best)return null;
  const seen={};const hdr=best.hdr.map((h,j)=>{let k=h||('欄'+(j+1));if(seen[k]){seen[k]++;k=k+'（'+seen[k]+'）'}else seen[k]=1;return k});
  const rows=[];
  for(let i=best.hi+1;i<best.aoa.length;i++){
    const r=best.aoa[i];const id=r[hdr.indexOf('人員編號')];
    if(id===null||id===undefined||String(id).trim()==='')continue;
    const o={};hdr.forEach((h,j)=>{const v=r[j];o[h]=typeof v==='string'?v.trim():v});o['人員編號']=String(id).trim();rows.push(o);
  }
  return {sheet:best.name,headers:hdr,rows};
}
async function handle(kind,file){
  const st=kind==='score'?$('#stScore'):$('#stPerson');
  const box=kind==='score'?$('#dropScore'):$('#dropPerson');
  st.className='status';st.textContent='讀取中…';
  try{
    const wb=await readFile(file);
    const t=findTable(wb,kind);
    if(!t){
      st.className='status err';
      st.textContent=(kind==='score'?'找不到分數表。':'找不到人員表。')+(S._why||'前 12 列內沒有「人員編號」欄。');
      box.classList.remove('ok');return;
    }
    if(kind==='score'){
      const miss=[...DIMS,...TYPES,...VALID.map(v=>v.col)].filter(x=>!t.headers.includes(x));
      S.score=t;
      st.textContent=`${file.name}｜${t.rows.length} 筆`+(miss.length?`｜缺少欄位：${miss.join('、')}`:'');
      if(miss.length)st.className='status err';
    }else{S.person=t;st.textContent=`${file.name}｜${t.rows.length} 筆`}
    box.classList.add('ok');
    build();
  }catch(e){st.className='status err';st.textContent='無法讀取這個檔案：'+(e.message||e);box.classList.remove('ok')}
}
for(const [kind,inp,box] of [['score','#fScore','#dropScore'],['person','#fPerson','#dropPerson']]){
  const i=$(inp),b=$(box);
  i.addEventListener('change',()=>{if(i.files[0])handle(kind,i.files[0]);i.value=''});
  b.addEventListener('dragover',e=>{e.preventDefault();b.classList.add('over')});
  b.addEventListener('dragleave',()=>b.classList.remove('over'));
  b.addEventListener('drop',e=>{e.preventDefault();b.classList.remove('over');const f=e.dataTransfer.files[0];if(f)handle(kind,f)});
}

/* ---------- merge ---------- */
function ageOf(r){
  let a=num(r['年齡']);if(!isNaN(a))return a;
  const b=r['生日'];const d=b instanceof Date?b:(b?new Date(String(b).replace(/\./g,'-')):null);
  if(!d||isNaN(d))return NaN;const n=new Date();a=n.getFullYear()-d.getFullYear();
  if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a;
}
function build(){
  if(!S.score)return;
  const pmap=new Map();let pKeys=[];
  if(S.person){pKeys=S.person.headers.filter(h=>h!=='人員編號');for(const p of S.person.rows)pmap.set(p['人員編號'],p)}
  let matched=0;
  S.all=S.score.rows.map(r=>{
    const o={...r};const p=pmap.get(r['人員編號']);
    if(p)matched++;
    for(const h of pKeys)o['P:'+h]=p?p[h]:null;
    for(const d of DIMS)o[d]=num(o[d]);
    for(const t of TYPES)o[t]=num(o[t]);
    o.__age=ageOf(o);
    o.__ageBin=isNaN(o.__age)?'未提供':o.__age<=20?'20歲以下':o.__age<=30?'21-30歲':o.__age<=40?'31-40歲':o.__age<=50?'41-50歲':'51歲以上';
    o.__gen=isNaN(o.__age)?'未提供':o.__age>=60?'60及以上':o.__age<30?'20世代':(Math.floor(o.__age/10)*10)+'世代';
    return o;
  });
  $('#nLabel').textContent=`有效資料 N＝${S.all.length}`;
  const unmatched=S.person?S.all.length-matched:0;
  $('#joinLabel').textContent=S.person?`人員檔對應到 ${matched} 筆`+(unmatched?`，${unmatched} 筆分數找不到人員資料（校標會歸為「(空白)」）`:''):'未上傳人員資料：校標分析無法使用';
  const okU=f=>{const u=new Set(S.all.map(r=>r[f]).filter(v=>v!=null&&v!==''));return u.size>=1&&u.size<=60};
  const okH=h=>!SKIP_FIELDS.has(h)&&!/^欄\d+$/.test(h);
  S.benchFields=pKeys.filter(okH).map(h=>'P:'+h).filter(okU);
  S.pieFields=[...S.benchFields,...['部門','職務名稱','職務類型','層級類別'].filter(h=>S.score.headers.includes(h)).filter(okU)];
  if(!S.benchFields.includes(S.benchField))S.benchField=S.benchFields.includes('P:性別')?'P:性別':(S.benchFields[0]||null);
  $('#app').hidden=false;$('#emptyState').hidden=true;
  render();
}
function fieldLabel(f){return f.startsWith('P:')?f.slice(2).replace(/^\[自訂\]/,''):f}

/* ---------- stats（照 Excel 模板邏輯） ---------- */
function stats(rows){
  const n=rows.length;
  // 14 向度：平均取整數；同分時排後面的向度視為較高（同 Excel 的 +ROW()/1e6）
  const dims=DIMS.map((d,i)=>{
    const v=rows.map(r=>r[d]).filter(x=>!isNaN(x));
    const a=v.length?Math.round(avg(v)):NaN;
    return {name:d,i,avg:a,key:isNaN(a)?-1:a+(i+1)/1e6,bands:BANDS.map(b=>n?v.filter(b.t).length/n:0)};
  });
  const ranked=dims.filter(d=>!isNaN(d.avg)).sort((a,b)=>b.key-a.key);
  const hi=ranked.slice(0,3);
  const lo=ranked.length>=5?ranked.slice(-2):[];
  // 五型：每人取最高分（含並列），四捨五入整數％，差額補到人次最多的那一型
  const cnt=TYPES.map(()=>0);
  for(const r of rows){const vs=TYPES.map(t=>r[t]);if(vs.every(isNaN))continue;const mx=Math.max(...vs.filter(x=>!isNaN(x)));vs.forEach((x,j)=>{if(x===mx)cnt[j]++})}
  const tot=cnt.reduce((a,b)=>a+b,0)||1;
  const rp=cnt.map(c=>Math.round(c*100/tot));
  const diff=100-rp.reduce((a,b)=>a+b,0);
  const mi=cnt.indexOf(Math.max(...cnt));
  const typePct=rp.map((p,j)=>(cnt.some(c=>c)?p+(j===mi?diff:0):0));
  // 效度
  const valid=VALID.map(v=>{const vs=rows.map(r=>str(r[v.col]));return {name:v.name,lv:[v.hi,v.mid,v.lo].map(k=>n?vs.filter(x=>x===k).length/n:0)}});
  return {n,dims,hi,lo,typeCnt:cnt,typePct,valid};
}

    cb.addEventListener('change',()=>{c.on=cb.checked;li.classList.toggle('off',!c.on);benchRerender()});
    inp.addEventListener('change',()=>{c.label=inp.value;renderEditor();benchRerender()});
    const up=el('button',{type:'button','aria-label':'上移',text:'▲',onclick:()=>{if(i>0){[cfg[i-1],cfg[i]]=[cfg[i],cfg[i-1]];renderEditor();benchRerender()}}});
    const dn=el('button',{type:'button','aria-label':'下移',text:'▼',onclick:()=>{if(i<cfg.length-1){[cfg[i+1],cfg[i]]=[cfg[i],cfg[i+1]];renderEditor();benchRerender()}}});
    li.append(cb,inp,el('span',{class:'cnt',text:(cmap.get(c.raw)||0)+'人'}),el('span',{class:'mv'},up,dn));
    if(c.label!==c.raw)li.append(el('span',{class:'raw',text:'原始值：'+c.raw}));
    ul.append(li);
  });
  ed.append(ul);
  const all=el('input',{type:'checkbox'});all.checked=S.showAll;
  all.addEventListener('change',()=>{S.showAll=all.checked;benchRerender()});
  ed.append(el('label',{class:'chk'},all,'比較圖加入「整體」'));
  ed.append(el('div',{class:'row'},
    el('button',{class:'btn',type:'button',text:'依人數排序',onclick:()=>{cfg.sort((a,b)=>(cmap.get(b.raw)||0)-(cmap.get(a.raw)||0));renderEditor();benchRerender()}}),
    el('button',{class:'btn',type:'button',text:'還原此欄位',onclick:()=>{delete S.benchCfg[S.benchField];renderEditor();benchRerender()}})));
}
function renderBench(){
  destroy('bench');
  if(!S.benchField){
    $('#editor').innerHTML='';$('#editor').hidden=true;
    $('#benchOut').innerHTML='';$('#benchOut').append(el('div',{class:'empty',text:S.person?'人員資料裡沒有可用的分群欄位（每欄需 1–60 類）。':'校標欄位來自人員資料，請先上傳人員資料。'}));
    return;
  }
  $('#editor').hidden=false;renderEditor();renderBenchOut();
}
function renderBenchOut(){
  const out=$('#benchOut');out.innerHTML='';
  const f=S.benchField;const FL=fieldLabel(f);
  const groups=groupsFor(f);
  if(!groups.length){out.append(el('div',{class:'empty',text:'這個欄位目前沒有可用的分群，請在左側勾選至少一群。'}));return}
  const whole=stats(S.all);
  const gs=groups.map((g,i)=>({...g,st:stats(g.rows),color:PAL[i%PAL.length]}));
  const sets=fn=>{const s=gs.map(g=>({label:g.label,data:fn(g.st),color:g.color}));if(S.showAll)s.push({label:'整體',data:fn(whole),color:'#a9b4be'});return s};
  out.append(el('h3',{class:'sec',text:`${FL}｜群組比較`}));
  const t=el('table');
  t.append(el('thead',{},el('tr',{},...['群組','人數',...TYPES,'高分項','低分項'].map(h=>el('th',{text:h})))));
  const tb=el('tbody');
  const rowOf=(label,st)=>el('tr',{},el('td',{text:label}),el('td',{class:'num',text:st.n}),...st.typePct.map(x=>el('td',{class:'num',text:x+'%'})),el('td',{text:st.hi.map(d=>d.name).join('、')}),el('td',{text:st.lo.map(d=>d.name).join('、')||'–'}));
  for(const g of gs)tb.append(rowOf(g.label,g.st));
  tb.append(rowOf('整體',whole));
  t.append(tb);out.append(el('div',{class:'tbl-wrap'},t));
  const small=gs.filter(g=>g.st.n<5).map(g=>g.label);
  if(small.length)out.append(el('p',{class:'warn',text:`人數少於 5 人：${small.join('、')}，平均數參考性低。`}));
  const g1=el('div',{class:'grid wide'});g1.style.marginTop='16px';out.append(g1);
  figure(g1,'bench',`${FL}｜14項性格向度比較`,'百分等級平均數',clusterCfg(DIMS,sets(st=>st.dims.map(d=>d.avg))),1.6);
  figure(g1,'bench',`${FL}｜行為類型分布比較`,'各群百分比',clusterCfg(TYPES,sets(st=>st.typePct),'%'),1.6);
  out.append(el('h3',{class:'sec',text:`${FL}｜各群明細`}));
  for(const g of gs){
    out.append(el('div',{class:'group-head'},el('h4',{text:g.label}),el('span',{text:`N＝${g.st.n}`})));
    const gg=el('div',{class:'grid'});out.append(gg);
    figure(gg,'bench',`${g.label}｜行為類型分布`,`N＝${g.st.n}`,typePieCfg(g.st),1.15);
    figure(gg,'bench',`${g.label}｜14項性格向度`,`百分等級平均數｜N＝${g.st.n}`,dimBarCfg(g.st),1.4);
    figure(gg,'bench',`${g.label}｜作答效度`,`N＝${g.st.n}`,validCfg(g.st),1.4);
    const hw=el('div');hw.style.marginTop='12px';out.append(hw);hw.append(hlTable(g.st));
  }
}

/* ---------- tabs & downloads ---------- */
document.querySelectorAll('nav.tabs [role=tab]').forEach(b=>b.addEventListener('click',()=>{
  S.tab=b.dataset.tab;
  document.querySelectorAll('nav.tabs [role=tab]').forEach(x=>x.setAttribute('aria-selected',x===b));
  for(const t of ['bg','overall','bench'])$('#p-'+t).hidden=t!==S.tab;
  render();
}));
async function save(blob,filename){
  const DL=await DLP;
  if(DL){
    try{await DL.save({filename,data:blob});toast('已下載 '+filename)}
    catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('上一個下載還在確認中，請稍候');return}toast('下載失敗：'+(e&&(e.message||e.code)||e))}
  }else{
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }
}
$('#zipBtn').addEventListener('click',async()=>{
  const list=S.charts[S.tab];if(!list.length){toast('這一頁還沒有圖');return}
  const btn=$('#zipBtn');btn.disabled=true;btn.textContent='打包中…';
  try{
    const zip=new JSZip();const used={};
    for(const c of list){
      const b=await new Promise(r=>c.ch.canvas.toBlob(r,'image/png'));
      let n=c.fname;if(used[n]){used[n]++;n=n.replace(/\.png$/,`_${used[n]}.png`)}else used[n]=1;
      zip.file(n,b);
    }
    const blob=await zip.generateAsync({type:'blob'});
    const tabName={bg:'背景資訊',overall:'整體',bench:'校標_'+fieldLabel(S.benchField||'')}[S.tab];
    await save(blob,safe(`PPSS_${tabName}`)+'.zip');
  }finally{btn.disabled=false;btn.textContent='下載本頁所有圖（ZIP）'}
});
(async()=>{try{await document.fonts.load('16px "Noto Sans TC"')}catch(e){}if(S.score)render()})();
</script>
